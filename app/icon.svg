<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background tile, so the icon reads on light and dark browser tabs -->
  <rect width="64" height="64" rx="14" fill="#0f131a"/>
  <!-- Clear case -->
  <rect x="17" y="6" width="30" height="52" rx="6" fill="#cfe0ff" fill-opacity="0.14" stroke="#dfe9ff" stroke-opacity="0.85" stroke-width="2.2"/>
  <!-- Board -->
  <rect x="20.5" y="9.5" width="23" height="45" rx="3" fill="#0c2a2a"/>
  <!-- Screen -->
  <rect x="22.5" y="12" width="19" height="13" rx="1.6" fill="#0b1f1b" stroke="#14161b" stroke-width="1"/>
  <rect x="25" y="15.5" width="9" height="2" rx="1" fill="#6fd6c2"/>
  <rect x="25" y="19.5" width="13" height="2" rx="1" fill="#6fd6c2" fill-opacity="0.55"/>
  <!-- Chips with their LEDs -->
  <rect x="23" y="29" width="7.5" height="6" rx="1" fill="#15171c"/>
  <rect x="33.5" y="29" width="7.5" height="6" rx="1" fill="#15171c"/>
  <circle cx="29.5" cy="27.5" r="1.2" fill="#ff6b7a"/>
  <circle cx="40" cy="27.5" r="1.2" fill="#a78bfa"/>
  <!-- Buttons -->
  <rect x="23.5" y="42" width="7" height="2.4" rx="1" fill="#3a4150"/>
  <rect x="25.8" y="39.7" width="2.4" height="7" rx="1" fill="#3a4150"/>
  <circle cx="38.5" cy="41" r="2.1" fill="#a78bfa"/>
  <circle cx="34.8" cy="44.6" r="2.1" fill="#ff6b7a"/>
</svg>
