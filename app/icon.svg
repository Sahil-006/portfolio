<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background tile, so the icon reads on light and dark browser tabs -->
  <rect width="64" height="64" rx="14" fill="#0f131a"/>
  <!-- Lid: clear frame with a terminal screen -->
  <rect x="11" y="12" width="42" height="28" rx="3" fill="#cfe0ff" fill-opacity="0.14" stroke="#dfe9ff" stroke-opacity="0.85" stroke-width="2"/>
  <rect x="14.5" y="15.5" width="35" height="21" rx="1.5" fill="#0b1f1b"/>
  <rect x="18" y="20" width="12" height="2.4" rx="1.2" fill="#6fd6c2"/>
  <rect x="18" y="25" width="20" height="2.4" rx="1.2" fill="#6fd6c2" fill-opacity="0.55"/>
  <!-- Sticky note -->
  <rect x="40" y="28" width="8" height="7" rx="0.8" fill="#ffe98f" transform="rotate(8 44 31.5)"/>
  <!-- Base, pulled slightly apart: keyboard deck and board -->
  <path d="M7 44 H57 L53 48 H11 Z" fill="#cfe0ff" fill-opacity="0.16" stroke="#dfe9ff" stroke-opacity="0.85" stroke-width="1.6" stroke-linejoin="round"/>
  <rect x="14" y="51" width="36" height="4" rx="1" fill="#0c2a2a" stroke="#6fd6c2" stroke-opacity="0.7" stroke-width="1"/>
  <circle cx="20" cy="53" r="1" fill="#ff6b7a"/>
  <circle cx="26" cy="53" r="1" fill="#a78bfa"/>
  <circle cx="32" cy="53" r="1" fill="#5eead4"/>
</svg>
